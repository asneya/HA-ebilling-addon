  del documento de sistema y 3 de los 4 de electrodoméstico de las filas del
  prototipo —el horno de ahí era la misma casa que el glifo `casa`, así que se
  descarta y se redibuja—. Los 19 últimos no están en ningún handoff: se
  dibujaron a mano para ampliar el catálogo de electrodomésticos, con el mismo
  trazo y la misma caja. `tools/generar-sprite.py` los añade después de la
  extracción, así que sobreviven a una regeneración.

  Ninguno lleva relleno, degradado ni color fijo: el color entra por
  `stroke: currentColor` desde el CSS, así que el mismo glifo sirve en
  tinta de nivel 1, 2 o 3 y en color de estado.

