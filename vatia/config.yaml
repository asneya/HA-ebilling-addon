name: Vatia
version: "0.44.1"
slug: vatia
description: Tu electricidad en tiempo real, con el origen del consumo, el coste del ciclo y comparativa de tarifas
url: https://github.com/asneya/HA-ebilling-addon
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt
panel_title: Vatia
# Vatia sale en la barra lateral de **todo el mundo**, no solo de los
# administradores, que es lo que hace el Supervisor por defecto
# (`panel_admin: true`). La app cuenta lo que gasta la casa y a qué hora
# conviene poner la lavadora: eso le sirve a quien vive en ella, tenga o no
# permisos para administrar Home Assistant. Además, desde la 0.42 cada persona
# tiene su propio orden de tarjetas, y eso solo tiene sentido si puede entrar.
#
# Cuidado con lo que implica: el add-on **no tiene autenticación propia** y por
# Ingress entra cualquier usuario de Home Assistant, así que quien vea el panel
# puede también cambiar los ajustes de la casa y descargar la copia de
# seguridad, que lleva el token de Home Assistant en claro. Con esto puesto, el
# panel es para gente de confianza.
panel_admin: false
homeassistant_api: true
# Carpeta propia del add-on, que el Supervisor expone en
# `/addon_configs/<slug>/`: ahí vive `vatia.json`, y así se puede leer, editar y
# respaldar con Samba, el File Editor o Studio Code Server.
map:
  - addon_config:rw
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)?
